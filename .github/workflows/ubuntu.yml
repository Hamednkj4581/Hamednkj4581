on:
  workflow_dispatch:
    inputs:
      os:
        description: '系统'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      
      port:
        description: '端口'
        required: true
        default: '9001'
        type: string

run-name: '${{ inputs.os }} ${{ inputs.port }}'

permissions:
  actions: write
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  job:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 运行Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          net user runneradmin mynewpassword@112233

          tzutil /s "China Standard Time"
          # 显示文件扩展名
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f
          # 显示隐藏文件
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f
          # 重启生效
          taskkill /f /im explorer.exe
          start explorer.exe

          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
    
          net stop termservice /y
          net start termservice

          netsh interface portproxy add v4tov4 listenport=1234 listenaddress=0.0.0.0 connectport=3389 connectaddress=127.0.0.1
          Start-Process -FilePath "tunnel-client-windows" -ArgumentList "-config client.yaml" -NoNewWindow

          cd C:/Users/runneradmin/Desktop

          # curl -LO https://github.com/Eugeny/tabby/releases/download/v1.0.230/tabby-1.0.230-portable-x64.zip
          # 7z x tabby-1.0.230-portable-x64.zip -otabby
          
          # curl -L -O https://cosbrowser.cloud.tencent.com/cosbrowser-setup-latest.exe
          # curl -L -o Xshell_Installer.exe https://cdn.netsarang.net/v8/Xshell-latest-p
          # curl -L -o Xftp_Installer.exe https://cdn.netsarang.net/v8/Xftp-latest-p
          # curl -L -O https://gosspublic.alicdn.com/ossbrowser/1.18.0/oss-browser-win32-x64.zip?spm=a2c4g.11186623.0.0.a371450fzLHNZ2&file=oss-browser-win32-x64.zip
          # curl -L -O https://cdn.mysql.com//Downloads/MySQLGUITools/mysql-workbench-community-8.0.46-winx64.msi

          # https://community.chocolatey.org/packages

          # choco install sublimetext4
          
          # echo "::group::vscode"
          # choco install vscode
          # echo "::endgroup::"

          Start-Sleep -Seconds 86400

      - name: 运行Linux
        if: ${{ runner.os == 'Linux' }}
        run: | 
          # 修改或添加 PasswordAuthentication yes
          grep -q '^#\?PasswordAuthentication' /etc/ssh/sshd_config \
            && sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config \
            || echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config

          grep -q '^#\?PasswordAuthentication' /etc/ssh/sshd_config.d/*.conf \
            && sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config.d/*.conf \
            || echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/*.conf
          
          sudo systemctl restart ssh

          echo "runner:mynewpassword" | sudo chpasswd
          docker run -d -p 1234:1234 --restart=always alpine/socat TCP-LISTEN:1234,fork TCP:172.17.0.1:22
          
          docker run -d \
            --restart unless-stopped \
            -p 8388:8388/tcp \
            -p 8388:8388/udp \
            -e TZ=Asia/Shanghai \
            -e METHOD=aes-256-gcm \
            -e PASSWORD=6a17a5dd-5f76-4b09-b567-9b0d5d449da5 \
            shadowsocks/shadowsocks-libev

          chmod +x tunnel-client-linux
          ./tunnel-client-linux

      - name: 运行macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          sudo systemsetup -settimezone Asia/Shanghai || true
          curl -s ipinfo.io || true

          # 开启远程登录 (SSH)，对齐 Linux
          sudo systemsetup -setremotelogin on || \
            sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist || true

          # runner 原密码未知，无法用 passwd 直接改；新建桌面用户，并尽量给 runner 设密
          if ! dscl . -read /Users/vncuser >/dev/null 2>&1; then
            MAX_UID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)
            USER_UID=$((MAX_UID + 1))
            sudo dscl . -create /Users/vncuser
            sudo dscl . -create /Users/vncuser UserShell /bin/zsh
            sudo dscl . -create /Users/vncuser RealName "VNC User"
            sudo dscl . -create /Users/vncuser UniqueID "$USER_UID"
            sudo dscl . -create /Users/vncuser PrimaryGroupID 80
            sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
            sudo createhomedir -c -u vncuser >/dev/null
          fi
          sudo dscl . -passwd /Users/vncuser mynewpassword
          sudo dseditgroup -o edit -a vncuser -t user admin || true
          sudo dscl . -passwd /Users/runner mynewpassword || true
          sudo sysadminctl -resetPasswordFor runner -newPassword mynewpassword || true

          # 屏幕共享 和 远程管理不能同时开，否则客户端会报「不被允许」
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "$KICKSTART" -deactivate -stop || true
          sudo launchctl bootout system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 1

          python3 - <<'PY' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          k = bytes.fromhex("1734516E8BA8C5E2FF1C39567390ADCA")
          p = b"mynewpassword"[:8]
          print("".join("%02X" % (k[i] ^ (p[i] if i < len(p) else 0)) for i in range(len(k))))
          PY
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          # 只开远程管理 + 传统 VNC（给 RealVNC / TigerVNC 用）
          sudo "$KICKSTART" -configure -allowAccessFor -allUsers -privs -all
          sudo "$KICKSTART" -configure -access -on -privs -all
          sudo "$KICKSTART" -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo "$KICKSTART" -restart -agent -console
          sudo "$KICKSTART" -activate
          sleep 2

          if ! lsof -nP -iTCP:5900 -sTCP:LISTEN >/dev/null; then
            echo "Remote Management 未监听 5900，改开屏幕共享"
            sudo "$KICKSTART" -deactivate -stop || true
            sleep 1
            sudo launchctl enable system/com.apple.screensharing || true
            sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || \
              sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
            sleep 2
          fi

          echo "==== VNC 5900 ===="
          lsof -nP -iTCP:5900 -sTCP:LISTEN || echo "WARNING: 5900 仍未监听"

          # 1234 -> VNC 5900（对齐 Windows 1234->3389、Linux 1234->22）
          python3 - <<'PY' &
          import socket, threading, select

          def pipe(a, b):
              try:
                  while True:
                      r, _, _ = select.select([a, b], [], [])
                      for s in r:
                          data = s.recv(65536)
                          if not data:
                              return
                          (b if s is a else a).sendall(data)
              except Exception:
                  pass
              finally:
                  try:
                      a.close()
                      b.close()
                  except Exception:
                      pass

          srv = socket.socket()
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("0.0.0.0", 1234))
          srv.listen(50)
          while True:
              c, _ = srv.accept()
              t = socket.create_connection(("127.0.0.1", 5900))
              threading.Thread(target=pipe, args=(c, t), daemon=True).start()
          PY

          chmod +x tunnel-client-darwin-arm64
          ./tunnel-client-darwin-arm64 -config client.yaml

      - name: Delete old workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting old runs for repo: $REPO"
          # 获取所有已完成的运行记录，保留最近 20 条，其他的删除
          gh run list --repo $REPO --limit 1000 --json databaseId --status completed \
            | jq '.[20:] | .[].databaseId' \
            | tr -d '\r' \
            | xargs -I {} gh run delete {} --repo $REPO
          
          echo "Cleanup complete."

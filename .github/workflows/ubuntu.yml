on:
  workflow_dispatch:
    inputs:
      os:
        description: '系统'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
          - macos-15
      
      port:
        description: '端口'
        required: true
        default: '9001'
        type: string

run-name: '${{ inputs.os }} ${{ inputs.port }}'

permissions:
  actions: write
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  job:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 运行Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          net user runneradmin mynewpassword@112233

          tzutil /s "China Standard Time"
          # 显示文件扩展名
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f
          # 显示隐藏文件
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f
          # 重启生效
          taskkill /f /im explorer.exe
          start explorer.exe

          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
    
          net stop termservice /y
          net start termservice

          netsh interface portproxy add v4tov4 listenport=1234 listenaddress=0.0.0.0 connectport=3389 connectaddress=127.0.0.1
          Start-Process -FilePath "tunnel-client-windows" -ArgumentList "-config client.yaml" -NoNewWindow

          cd C:/Users/runneradmin/Desktop

          # curl -LO https://github.com/Eugeny/tabby/releases/download/v1.0.230/tabby-1.0.230-portable-x64.zip
          # 7z x tabby-1.0.230-portable-x64.zip -otabby
          
          # curl -L -O https://cosbrowser.cloud.tencent.com/cosbrowser-setup-latest.exe
          # curl -L -o Xshell_Installer.exe https://cdn.netsarang.net/v8/Xshell-latest-p
          # curl -L -o Xftp_Installer.exe https://cdn.netsarang.net/v8/Xftp-latest-p
          # curl -L -O https://gosspublic.alicdn.com/ossbrowser/1.18.0/oss-browser-win32-x64.zip?spm=a2c4g.11186623.0.0.a371450fzLHNZ2&file=oss-browser-win32-x64.zip
          # curl -L -O https://cdn.mysql.com//Downloads/MySQLGUITools/mysql-workbench-community-8.0.46-winx64.msi

          # https://community.chocolatey.org/packages

          # choco install sublimetext4
          
          # echo "::group::vscode"
          # choco install vscode
          # echo "::endgroup::"

          Start-Sleep -Seconds 86400

      - name: 运行Linux
        if: ${{ runner.os == 'Linux' }}
        run: | 
          # 修改或添加 PasswordAuthentication yes
          grep -q '^#\?PasswordAuthentication' /etc/ssh/sshd_config \
            && sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config \
            || echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config

          grep -q '^#\?PasswordAuthentication' /etc/ssh/sshd_config.d/*.conf \
            && sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config.d/*.conf \
            || echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/*.conf
          
          sudo systemctl restart ssh

          echo "runner:mynewpassword" | sudo chpasswd
          docker run -d -p 1234:1234 --restart=always alpine/socat TCP-LISTEN:1234,fork TCP:172.17.0.1:22
          
          docker run -d \
            --restart unless-stopped \
            -p 8388:8388/tcp \
            -p 8388:8388/udp \
            -e TZ=Asia/Shanghai \
            -e METHOD=aes-256-gcm \
            -e PASSWORD=6a17a5dd-5f76-4b09-b567-9b0d5d449da5 \
            shadowsocks/shadowsocks-libev

          chmod +x tunnel-client-linux
          ./tunnel-client-linux

      - name: 运行macOS
        if: ${{ runner.os == 'macOS' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          RUSTDESK_PASSWORD: mynewpassword
        run: |
          sudo systemsetup -settimezone Asia/Shanghai || true
          brew install displayplacer tesseract
          brew install --cask rustdesk
          xattr -cr /Applications/RustDesk.app || true

          display_id=$(displayplacer list 2>/dev/null | grep -o 'Persistent screen id: [^ ]*' | awk '{print $4}' | head -n 1)
          if [ -n "$display_id" ]; then
            displayplacer "id:$display_id res:1920x1080" || true
          fi

          sudo python3 - <<'PY'
          import os, sqlite3, time
          db = "/Library/Application Support/com.apple.TCC/TCC.db"
          if not os.path.exists(db):
              raise SystemExit(0)
          now = int(time.time())
          con = sqlite3.connect(db)
          clients = [
              (0, "com.carriez.RustDesk"),
              (1, "/Applications/RustDesk.app/Contents/MacOS/RustDesk"),
          ]
          for svc in ("kTCCServiceScreenCapture", "kTCCServiceAccessibility", "kTCCServiceListenEvent", "kTCCServicePostEvent"):
              for ctype, client in clients:
                  con.execute(
                      "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES (?,?,?,2,4,1,'UNUSED',0,?)",
                      (svc, client, ctype, now),
                  )
          con.commit()
          PY
          sudo killall tccd 2>/dev/null || true

          mkdir -p "$HOME/Library/Preferences/com.carriez.RustDesk"
          python3 - <<'PY'
          import os, re
          path = os.path.expanduser("~/Library/Preferences/com.carriez.RustDesk/RustDesk2.toml")
          body = open(path, encoding="utf-8", errors="replace").read() if os.path.exists(path) else ""
          if "[options]" not in body:
              body += "\n[options]\n"
          for key, val in (
              ("approve-mode", "password"),
              ("verification-method", "use-both-passwords"),
              ("direct-server", "Y"),
              ("direct-access-port", "21118"),
          ):
              if re.search(rf"(?m)^{re.escape(key)}\s*=", body):
                  body = re.sub(rf"(?m)^{re.escape(key)}\s*=.*$", f"{key} = '{val}'", body)
              else:
                  body = body.replace("[options]", f"[options]\n{key} = '{val}'", 1)
          open(path, "w", encoding="utf-8").write(body)
          PY

          RD="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          open -a RustDesk
          sleep 8
          "$RD" --password "$RUSTDESK_PASSWORD" || true

          ID=""
          for i in {1..15}; do
            ID=$("$RD" --get-id 2>/dev/null | tr -d '\r' | tail -n 1)
            if [ -n "$ID" ] && [ "$ID" != "0" ]; then
              break
            fi
            sleep 2
          done

          mkdir -p images
          screencapture -x images/rustdesk.png || true
          OTP=$(tesseract images/rustdesk.png stdout 2>/dev/null | python3 -c '
          import sys, re
          text = sys.stdin.read().lower()
          skip = {"remote", "record", "screen", "config", "button", "window", "system"}
          pws = [p for p in re.findall(r"\b[a-z0-9]{6}\b", text) if p not in skip]
          print(pws[0] if pws else "")
          ')

          cat > /tmp/rd-proxy.py <<'PY'
          import select, socket, threading
          def pipe(a, b):
              try:
                  while True:
                      r, _, _ = select.select([a, b], [], [], 120)
                      if not r:
                          continue
                      for s in r:
                          data = s.recv(65536)
                          if not data:
                              return
                          (b if s is a else a).sendall(data)
              except Exception:
                  pass
              finally:
                  for s in (a, b):
                      try:
                          s.close()
                      except Exception:
                          pass
          srv = socket.socket()
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("0.0.0.0", 1234))
          srv.listen(50)
          while True:
              c, _ = srv.accept()
              def handle(c=c):
                  try:
                      t = socket.create_connection(("127.0.0.1", 21118), 5)
                  except OSError:
                      c.close()
                      return
                  c.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
                  t.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
                  pipe(c, t)
              threading.Thread(target=handle, daemon=True).start()
          PY

          echo "========================================"
          echo "RustDesk 直连 ID: 47.107.154.171:9999"
          echo "一次性密码: ${OTP:-见截图}"
          echo "固定密码: $RUSTDESK_PASSWORD"
          echo "公共 ID: ${ID:-FAILED}"
          echo "========================================"
          {
            echo "## RustDesk"
            echo "- **直连 ID:** \`47.107.154.171:9999\`"
            echo "- **一次性密码:** \`${OTP:-见截图}\`"
            echo "- **固定密码:** \`$RUSTDESK_PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传macOS截图
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-rustdesk
          path: images/*
          if-no-files-found: ignore

      - name: Delete old workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting old runs for repo: $REPO"
          gh run list --repo $REPO --limit 1000 --json databaseId --status completed \
            | jq '.[20:] | .[].databaseId' \
            | tr -d '\r' \
            | xargs -I {} gh run delete {} --repo $REPO
          echo "Cleanup complete."

      - name: 保持macOS会话
        if: ${{ runner.os == 'macOS' }}
        run: |
          python3 /tmp/rd-proxy.py >/tmp/rd-proxy.log 2>&1 &
          chmod +x tunnel-client-darwin-arm64
          ./tunnel-client-darwin-arm64 -config client.yaml

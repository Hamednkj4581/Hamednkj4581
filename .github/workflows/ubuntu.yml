on:
  workflow_dispatch:
    inputs:
      os:
        description: '系统'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - android
          - macos-15
          - macos-26
          - macos-latest
      
      code:
        description: 'NatLink 设备码（9 位数字，留空自动生成）'
        required: false
        default: ''
        type: string
      password:
        description: 'NatLink 连接密码（6–64 个字符，连接端需填写相同密码）'
        required: true
        default: 'mynewpassword'
        type: string

run-name: '${{ inputs.os }} NatLink'

permissions:
  actions: write
  contents: read

env:
  TZ: Asia/Shanghai
  NATLINK_PASSWORD: ${{ inputs.password }}

jobs:
  job:
    runs-on: ${{ inputs.os == 'android' && 'ubuntu-latest' || inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 准备 NatLink
        shell: bash
        env:
          INPUT_CODE: ${{ inputs.code }}
          REMOTE_OS: ${{ inputs.os }}
        run: |
          set -euo pipefail
          # 上海时间 UTC+8；POSIX 时区写法兼容 Windows Git Bash。
          NATLINK_NAME="$REMOTE_OS $(TZ=CST-8 date '+%Y-%m-%d %H:%M:%S')"
          if (( ${#NATLINK_PASSWORD} < 6 || ${#NATLINK_PASSWORD} > 64 )) || [[ "$NATLINK_PASSWORD" =~ [[:cntrl:]] ]]; then
            echo "::error::NatLink 连接密码必须为 6–64 个字符，且不能包含控制字符"
            exit 1
          fi
          NATLINK_CODE="$INPUT_CODE"
          if [ -z "$NATLINK_CODE" ]; then
            printf -v NATLINK_CODE '%03d%03d%03d' "$((100 + RANDOM % 900))" "$((RANDOM % 1000))" "$((RANDOM % 1000))"
          fi
          if [[ ! "$NATLINK_CODE" =~ ^[0-9]{9}$ ]]; then
            echo "::error::NatLink 设备码必须为 9 位数字"
            exit 1
          fi
          if [ "$REMOTE_OS" = android ]; then
            NATLINK_PORTS=5037,27183
          else
            case "$RUNNER_OS" in
              Windows) NATLINK_PORTS=3389 ;;
              Linux) NATLINK_PORTS=22,8388 ;;
              macOS) NATLINK_PORTS=21118 ;;
              *) echo "::error::不支持的系统：$RUNNER_OS"; exit 1 ;;
            esac
          fi
          echo "NATLINK_NAME=$NATLINK_NAME" >> "$GITHUB_ENV"
          echo "NATLINK_CODE=$NATLINK_CODE" >> "$GITHUB_ENV"
          echo "NATLINK_PORTS=$NATLINK_PORTS" >> "$GITHUB_ENV"
          {
            echo "## NatLink"
            echo "- 设备码：\`$NATLINK_CODE\`"
            echo "- 连接密码：\`$NATLINK_PASSWORD\`"
            echo "- 开放的本机 TCP 端口：\`$NATLINK_PORTS\`"
            echo "连接端必须填写相同的 NatLink 连接密码，无人值守模式才会接受请求。"
            echo "在本机 NatLink 中连接上述设备码，使用连接后显示的本机映射端口访问服务。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 静默安装微信输入法
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'WeTypeSetup.exe'
          try {
            Invoke-WebRequest -Uri 'https://download.z.weixin.qq.com/app/win/WeTypeSetup_3.0.0.32_3.exe' -OutFile $installer
            $expectedHash = '784182A330329655B5404E93A33B6C0A12AE0B5A6369F68BC3C64CE0DE87E19D'
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
              throw '微信输入法安装包 SHA-256 校验失败'
            }
            $process = Start-Process -FilePath $installer -ArgumentList '/s' -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "微信输入法静默安装失败，退出码：$($process.ExitCode)"
            }
          } finally {
            Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
          }

      - name: 运行Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          net user runneradmin mynewpassword@112233

          tzutil /s "China Standard Time"
          # 显示文件扩展名
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f
          # 显示隐藏文件
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f
          # 重启生效
          taskkill /f /im explorer.exe
          start explorer.exe

          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
    
          net stop termservice /y
          net start termservice

          cd C:/Users/runneradmin/Desktop

          # curl -LO https://github.com/Eugeny/tabby/releases/download/v1.0.230/tabby-1.0.230-portable-x64.zip
          # 7z x tabby-1.0.230-portable-x64.zip -otabby
          
          # curl -L -O https://cosbrowser.cloud.tencent.com/cosbrowser-setup-latest.exe
          # curl -L -o Xshell_Installer.exe https://cdn.netsarang.net/v8/Xshell-latest-p
          # curl -L -o Xftp_Installer.exe https://cdn.netsarang.net/v8/Xftp-latest-p
          # curl -L -O https://gosspublic.alicdn.com/ossbrowser/1.18.0/oss-browser-win32-x64.zip?spm=a2c4g.11186623.0.0.a371450fzLHNZ2&file=oss-browser-win32-x64.zip
          # curl -L -O https://cdn.mysql.com//Downloads/MySQLGUITools/mysql-workbench-community-8.0.46-winx64.msi

          # https://community.chocolatey.org/packages

          # choco install sublimetext4
          
          # echo "::group::vscode"
          # choco install vscode
          # echo "::endgroup::"

          & "$env:GITHUB_WORKSPACE/natlink/natlink-cli-windows-x64.exe" --code "$env:NATLINK_CODE" --name "$env:NATLINK_NAME" --ports "$env:NATLINK_PORTS" --password "$env:NATLINK_PASSWORD"

      - name: 运行Linux
        if: ${{ runner.os == 'Linux' && inputs.os != 'android' }}
        run: | 
          # 修改或添加 PasswordAuthentication yes
          grep -q '^#\?PasswordAuthentication' /etc/ssh/sshd_config \
            && sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config \
            || echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config

          grep -q '^#\?PasswordAuthentication' /etc/ssh/sshd_config.d/*.conf \
            && sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config.d/*.conf \
            || echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/*.conf
          
          sudo systemctl restart ssh

          echo "runner:mynewpassword" | sudo chpasswd
          
          docker run -d \
            --restart unless-stopped \
            -p 8388:8388/tcp \
            -p 8388:8388/udp \
            -e TZ=Asia/Shanghai \
            -e METHOD=aes-256-gcm \
            -e PASSWORD=6a17a5dd-5f76-4b09-b567-9b0d5d449da5 \
            shadowsocks/shadowsocks-libev

          chmod +x natlink/natlink-cli-linux-x64
          ./natlink/natlink-cli-linux-x64 --code "$NATLINK_CODE" --name "$NATLINK_NAME" --ports "$NATLINK_PORTS" --password "$NATLINK_PASSWORD"

      - name: 运行Android
        if: ${{ inputs.os == 'android' }}
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          export ANDROID_AVD_HOME="${HOME}/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            emulator \
            platform-tools \
            "system-images;android-34;google_apis;x86_64"

          SYS="system-images/android-34/google_apis/x86_64/"
          test -d "${ANDROID_SDK_ROOT}/${SYS}"
          mkdir -p "${ANDROID_AVD_HOME}/gh-android.avd"
          cat > "${ANDROID_AVD_HOME}/gh-android.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=${ANDROID_AVD_HOME}/gh-android.avd
          path.rel=avd/gh-android.avd
          target=android-34
          EOF
          cat > "${ANDROID_AVD_HOME}/gh-android.avd/config.ini" <<EOF
          AvdId=gh-android
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.ramSize=3072
          hw.lcd.density=420
          hw.lcd.width=1080
          hw.lcd.height=2400
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          image.sysdir.1=${SYS}
          tag.display=Google APIs
          tag.id=google_apis
          PlayStore.enabled=false
          disk.dataPartition.size=6G
          EOF
          sed -i 's/^[[:space:]]*//' "${ANDROID_AVD_HOME}/gh-android.ini" "${ANDROID_AVD_HOME}/gh-android.avd/config.ini"
          test -f "${ANDROID_AVD_HOME}/gh-android.ini"
          emulator -list-avds

          adb kill-server || true
          adb -P 5037 start-server

          emulator -avd gh-android \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on \
            -no-snapshot -cores 2 -memory 3072 \
            >/tmp/emulator.log 2>&1 &

          timeout 180 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          booted=0
          for _ in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 5
          done
          test "$booted" = 1 || { cat /tmp/emulator.log; exit 1; }

          {
            echo "## Android scrcpy"
            echo '连接 NatLink 后，将下方两个占位符替换为远端 5037 和 27183 对应的本机映射端口。'
            echo '```bash'
            echo 'export ADB_SERVER_SOCKET=tcp:127.0.0.1:<5037 对应的本机端口>'
            echo 'scrcpy --port=27183 --force-adb-forward \'
            echo '  --tunnel-host=127.0.0.1 --tunnel-port=<27183 对应的本机端口> \'
            echo '  --no-audio --video-buffer=0 \'
            echo '  --max-size=1024 --video-bit-rate=2M --max-fps=30'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          chmod +x natlink/natlink-cli-linux-x64
          ./natlink/natlink-cli-linux-x64 --code "$NATLINK_CODE" --name "$NATLINK_NAME" --ports "$NATLINK_PORTS" --password "$NATLINK_PASSWORD"

      - name: 运行macOS
        if: ${{ runner.os == 'macOS' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          RUSTDESK_PASSWORD: mynewpassword
        run: |
          sudo systemsetup -settimezone Asia/Shanghai || true
          brew install displayplacer cliclick tesseract || true
          brew install --cask rustdesk
          set +e
          xattr -cr /Applications/RustDesk.app || true

          display_id=$(displayplacer list 2>/dev/null | grep -o 'Persistent screen id: [^ ]*' | awk '{print $4}' | head -n 1)
          if [ -n "$display_id" ]; then
            displayplacer "id:$display_id res:1920x1080" || true
          fi

          sudo python3 - <<'PY'
          import os, sqlite3, subprocess, time

          def csreq_blob(app):
              try:
                  out = subprocess.check_output(["codesign", "-d", "-r-", app], stderr=subprocess.STDOUT, text=True)
                  req = ""
                  for line in out.splitlines():
                      if "=>" in line:
                          req = line.split("=>", 1)[1].strip()
                  if not req:
                      return None
                  subprocess.run(["csreq", "-r-", "-b", "/tmp/rd.csreq"], input=req, text=True, check=True)
                  return open("/tmp/rd.csreq", "rb").read()
              except Exception as e:
                  print("csreq skip:", e)
                  return None

          def grant_db(path, blob):
              if not os.path.exists(path):
                  return
              now = int(time.time())
              con = sqlite3.connect(path)
              cols = {r[1] for r in con.execute("PRAGMA table_info(access)")}
              clients = [
                  (0, "com.carriez.RustDesk"),
                  (0, "com.carriez.rustdesk"),
                  (1, "/Applications/RustDesk.app"),
                  (1, "/Applications/RustDesk.app/Contents/MacOS/RustDesk"),
                  (1, "/Applications/RustDesk.app/Contents/MacOS/service"),
                  (1, "/opt/homebrew/bin/cliclick"),
                  (1, "/usr/local/bin/cliclick"),
                  (1, "/usr/bin/osascript"),
              ]
              svcs = (
                  "kTCCServiceScreenCapture",
                  "kTCCServiceAccessibility",
                  "kTCCServiceListenEvent",
                  "kTCCServicePostEvent",
              )
              for svc in svcs:
                  for ctype, client in clients:
                      row = {
                          "service": svc,
                          "client": client,
                          "client_type": ctype,
                          "auth_value": 2,
                          "auth_reason": 3,
                          "auth_version": 1,
                          "csreq": blob,
                          "indirect_object_identifier_type": 0,
                          "indirect_object_identifier": "UNUSED",
                          "flags": 0,
                          "last_modified": now,
                          "boot_uuid": "",
                          "last_reminded": 0,
                      }
                      names = [n for n in row if n in cols]
                      sql = "INSERT OR REPLACE INTO access (%s) VALUES (%s)" % (
                          ",".join(names),
                          ",".join(["?"] * len(names)),
                      )
                      con.execute(sql, [row[n] for n in names])
              con.commit()
              print("TCC granted:", path)

          blob = csreq_blob("/Applications/RustDesk.app")
          try:
              grant_db("/Library/Application Support/com.apple.TCC/TCC.db", blob)
              grant_db(os.path.expanduser("~/Library/Application Support/com.apple.TCC/TCC.db"), blob)
          except Exception as e:
              print("TCC skip:", e)
          PY
          sudo killall tccd 2>/dev/null || true

          mkdir -p "$HOME/Library/Preferences/com.carriez.RustDesk"
          python3 - <<'PY'
          import os, re
          path = os.path.expanduser("~/Library/Preferences/com.carriez.RustDesk/RustDesk2.toml")
          body = open(path, encoding="utf-8", errors="replace").read() if os.path.exists(path) else ""
          if "[options]" not in body:
              body += "\n[options]\n"
          for key, val in (
              ("approve-mode", "password"),
              ("verification-method", "use-both-passwords"),
              ("direct-server", "Y"),
              ("direct-access-port", "21118"),
              ("enable-keyboard", "Y"),
              ("enable-clipboard", "Y"),
              ("stop-service", "N"),
              ("allow-remote-config-modification", "Y"),
          ):
              if re.search(rf"(?m)^{re.escape(key)}\s*=", body):
                  body = re.sub(rf"(?m)^{re.escape(key)}\s*=.*$", f"{key} = '{val}'", body)
              else:
                  body = body.replace("[options]", f"[options]\n{key} = '{val}'", 1)
          open(path, "w", encoding="utf-8").write(body)
          os.system("sudo mkdir -p /var/root/Library/Preferences/com.carriez.RustDesk")
          os.system("sudo cp %r /var/root/Library/Preferences/com.carriez.RustDesk/RustDesk2.toml" % path)
          PY

          RD="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          SVC="/Applications/RustDesk.app/Contents/MacOS/service"
          UID_NUM=$(id -u)
          python3 - <<'PY'
          import textwrap
          daemon = textwrap.dedent("""\
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>com.carriez.RustDesk_service</string>
            <key>KeepAlive</key><true/>
            <key>RunAtLoad</key><true/>
            <key>ProgramArguments</key>
            <array>
              <string>/Applications/RustDesk.app/Contents/MacOS/RustDesk</string>
              <string>--service</string>
            </array>
            <key>WorkingDirectory</key><string>/Applications/RustDesk.app/Contents/MacOS/</string>
          </dict></plist>
          """)
          agent = textwrap.dedent("""\
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>com.carriez.RustDesk_server</string>
            <key>LimitLoadToSessionType</key>
            <array><string>Aqua</string><string>LoginWindow</string></array>
            <key>KeepAlive</key><true/>
            <key>RunAtLoad</key><true/>
            <key>ProgramArguments</key>
            <array>
              <string>/Applications/RustDesk.app/Contents/MacOS/RustDesk</string>
              <string>--server</string>
            </array>
            <key>WorkingDirectory</key><string>/Applications/RustDesk.app/Contents/MacOS/</string>
            <key>ProcessType</key><string>Interactive</string>
          </dict></plist>
          """)
          open("/tmp/rd-daemon.plist", "w").write(daemon)
          open("/tmp/rd-agent.plist", "w").write(agent)
          PY
          sudo cp /tmp/rd-daemon.plist /Library/LaunchDaemons/com.carriez.RustDesk_service.plist
          sudo cp /tmp/rd-agent.plist /Library/LaunchAgents/com.carriez.RustDesk_server.plist
          sudo chown root:wheel /Library/LaunchDaemons/com.carriez.RustDesk_service.plist /Library/LaunchAgents/com.carriez.RustDesk_server.plist
          sudo launchctl bootout system/com.carriez.RustDesk_service 2>/dev/null || true
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.carriez.RustDesk_service.plist || sudo launchctl load -w /Library/LaunchDaemons/com.carriez.RustDesk_service.plist || true
          launchctl bootout gui/$UID_NUM/com.carriez.RustDesk_server 2>/dev/null || true
          launchctl bootstrap gui/$UID_NUM /Library/LaunchAgents/com.carriez.RustDesk_server.plist || launchctl load -w /Library/LaunchAgents/com.carriez.RustDesk_server.plist || true
          if [ -x "$SVC" ]; then sudo "$SVC" >/tmp/rd-service.log 2>&1 & fi
          "$RD" --server >/tmp/rd-server.log 2>&1 &

          open /Applications/RustDesk.app || true
          sleep 6
          pgrep -x RustDesk >/dev/null || "$RD" >/tmp/rd-gui.log 2>&1 &
          sleep 2
          "$RD" --password "$RUSTDESK_PASSWORD" || true

          mkdir -p images
          python3 - <<'PY'
          import os, subprocess, time
          os.makedirs("images", exist_ok=True)
          buttons = ("configure", "install", "allow", "reopen", "system settings")
          skip = {"connect", "remote", "cancel", "close"}
          toggled = False

          def ax_click_allow():
              script = '''
          tell application "System Events"
            repeat with p in (every process)
              try
                tell p
                  if exists (button "Allow" of window 1) then
                    click button "Allow" of window 1
                  end if
                  if exists (button "Quit and Reopen" of window 1) then
                    click button "Quit and Reopen" of window 1
                  end if
                  if exists (button "Open System Settings" of window 1) then
                    click button "Open System Settings" of window 1
                  end if
                  if exists (button "Reopen" of window 1) then
                    click button "Reopen" of window 1
                  end if
                end tell
              end try
            end repeat
          end tell
          '''
              try:
                  subprocess.run(["osascript", "-e", script], timeout=8, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              except Exception:
                  pass

          for i in range(10):
              ax_click_allow()
              shot = "images/grant.png"
              subprocess.call(["screencapture", "-C", "-x", shot], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  out = subprocess.check_output(["tesseract", shot, "stdout", "tsv"], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  time.sleep(1)
                  continue
              rows = []
              for line in out.splitlines()[1:]:
                  parts = line.split("\t")
                  if len(parts) < 12:
                      continue
                  text = (parts[11] or "").strip()
                  if not text:
                      continue
                  try:
                      l, t, w, h = map(int, parts[6:10])
                  except ValueError:
                      continue
                  if w <= 0 or h <= 0:
                      continue
                  rows.append((text.lower(), l, t, w, h, text))
              front = ""
              try:
                  front = subprocess.check_output(
                      ["osascript", "-e", 'tell application "System Events" to get name of first application process whose frontmost is true'],
                      text=True,
                      timeout=5,
                  ).strip().lower()
              except Exception:
                  pass
              clicked = False
              for low, l, t, w, h, text in rows:
                  if "reopen" in low:
                      x, y = l + w // 2, t + h // 2
                      print("click", text, x, y)
                      subprocess.call(["cliclick", "c:%s,%s" % (x, y)])
                      clicked = True
                      break
              if clicked:
                  time.sleep(1)
                  continue
              if "system" in front:
                  if not toggled:
                      for low, l, t, w, h, text in rows:
                          if "rustdesk" in low:
                              x, y = l + w + 72, t + h // 2
                              print("toggle", text, x, y)
                              subprocess.call(["cliclick", "c:%s,%s" % (x, y)])
                              toggled = True
                              clicked = True
                              break
              else:
                  for low, l, t, w, h, text in rows:
                      if "recording" in low:
                          x, y = l + w // 2, t + h + 48
                          print("configure-below", text, x, y)
                          subprocess.call(["cliclick", "c:%s,%s" % (x, y)])
                          clicked = True
                          break
              if not clicked:
                  for low, l, t, w, h, text in rows:
                      if low in skip:
                          continue
                      if low in buttons or any(b in low for b in buttons):
                          x, y = l + w // 2, t + h // 2
                          print("click", text, x, y)
                          subprocess.call(["cliclick", "c:%s,%s" % (x, y)])
                          break
              time.sleep(1)
          PY

          osascript -e 'tell application "RustDesk" to quit' >/dev/null 2>&1 || true
          killall RustDesk 2>/dev/null || true
          sudo killall RustDesk 2>/dev/null || true
          sleep 3
          sudo launchctl kickstart -k system/com.carriez.RustDesk_service 2>/dev/null || true
          launchctl kickstart -k "gui/${UID_NUM}/com.carriez.RustDesk_server" 2>/dev/null || "$RD" --server >/tmp/rd-server.log 2>&1 &
          sleep 2
          open /Applications/RustDesk.app || true
          sleep 8
          osascript -e 'tell application "System Settings" to quit' >/dev/null 2>&1 || true
          osascript -e 'tell application "RustDesk" to activate' >/dev/null 2>&1 || true
          sleep 4

          python3 - <<'PY'
          import re, subprocess, time

          days = "sun mon tue wed thu fri sat".split()
          months = "jan feb mar apr may jun jul aug sep oct nov dec".split()
          skip = {
              "remote", "record", "screen", "config", "button", "window", "system", "server",
              "connect", "desktop", "finder", "safari", "launch", "ready", "please", "faster",
              "enter", "oops", "recent", "session", "sessions", "control", "rustdesk", "password",
              "one", "time", "your", "setup", "help", "edit", "view", "mail", "music",
              "reopen", "report", "ignore", "cancel", "please",
          }
          skip.update(days)
          skip.update(months)
          for d in days:
              for m in months:
                  skip.add(d + m)
          dateish = re.compile(r"^(?:[a-z]{3}\d{2}|\d{2}[a-z]{3})$")

          def ok(tok):
              return bool(tok) and tok not in skip and not dateish.match(tok) and not tok.isdigit()

          def from_text(text):
              text = text.lower()
              m = re.search(r"password[:\s]+([a-z0-9]{6})\b", text)
              if m and ok(m.group(1)):
                  return m.group(1)
              toks = [t for t in re.findall(r"\b[a-z0-9]{6}\b", text) if ok(t)]
              mixed = [t for t in toks if re.search(r"[a-z]", t) and re.search(r"[0-9]", t)]
              return (mixed or toks)[0] if (mixed or toks) else ""

          def from_tsv(tsv):
              words = []
              for line in tsv.splitlines()[1:]:
                  parts = line.split("\t")
                  if len(parts) < 12:
                      continue
                  text = (parts[11] or "").strip().lower()
                  if not text:
                      continue
                  try:
                      l, t, w, h = map(int, parts[6:10])
                  except ValueError:
                      continue
                  words.append((text, l, t, w, h))
              labels = [w for w in words if "password" in w[0]]
              ranked = []
              for text, l, t, w, h in words:
                  tok = re.sub(r"[^a-z0-9]", "", text)
                  if len(tok) != 6 or not ok(tok):
                      continue
                  near = any(abs(l - pl) < 280 and t >= pt and (t - pt) < 160 for _, pl, pt, pw, ph in labels)
                  mixed = bool(re.search(r"[a-z]", tok) and re.search(r"[0-9]", tok))
                  ranked.append((0 if near else 1, 0 if mixed else 1, tok))
              ranked.sort()
              return ranked[0][2] if ranked else ""

          def dismiss_crash():
              script = '''
          tell application "System Events"
            repeat with p in (every process)
              try
                tell p
                  if exists (button "Reopen" of window 1) then
                    click button "Reopen" of window 1
                  end if
                end tell
              end try
            end repeat
          end tell
          '''
              try:
                  subprocess.run(["osascript", "-e", script], timeout=8, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              except Exception:
                  pass

          def rustdesk_running():
              try:
                  subprocess.check_output(["pgrep", "-x", "RustDesk"], stderr=subprocess.DEVNULL)
                  return True
              except Exception:
                  return False

          otp = ""
          for i in range(12):
              dismiss_crash()
              if not rustdesk_running():
                  subprocess.call(["open", "/Applications/RustDesk.app"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(5)
              subprocess.call(
                  ["osascript", "-e", 'tell application "RustDesk" to activate'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              time.sleep(2)
              subprocess.call(
                  ["screencapture", "-x", "images/rustdesk.png"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              tsv = txt = ""
              try:
                  tsv = subprocess.check_output(
                      ["tesseract", "images/rustdesk.png", "stdout", "tsv"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except Exception:
                  pass
              try:
                  txt = subprocess.check_output(
                      ["tesseract", "images/rustdesk.png", "stdout"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except Exception:
                  pass
              low = txt.lower()
              crashed = "unexpectedly" in low or "generating" in low
              otp = "" if crashed else (from_tsv(tsv) or from_text(txt))
              print("otp-try", i + 1, otp, "crashed" if crashed else "ok")
              if otp:
                  break
          open("/tmp/rd-otp.txt", "w").write(otp)
          print("otp-final", otp)
          PY
          OTP=$(cat /tmp/rd-otp.txt 2>/dev/null || true)

          echo "========================================"
          echo "RustDesk 直连 ID: 127.0.0.1:<NatLink 映射的 21118 端口>"
          echo "一次性密码: $OTP"
          echo "不要填 mynewpassword，只用上面的一次性密码"
          echo "========================================"
          {
            echo "## RustDesk"
            echo "- **直连 ID:** 连接 NatLink 后使用 \`127.0.0.1:<21118 对应的本机端口>\`"
            echo "- **一次性密码:** \`$OTP\`"
            echo "- 不要用固定密码 mynewpassword"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传macOS截图
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-rustdesk
          path: images/*
          if-no-files-found: ignore

      - name: Delete old workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting old runs for repo: $REPO"
          gh run list --repo $REPO --limit 1000 --json databaseId --status completed \
            | jq '.[20:] | .[].databaseId' \
            | tr -d '\r' \
            | xargs -I {} gh run delete {} --repo $REPO
          echo "Cleanup complete."

      - name: 保持macOS会话
        if: ${{ runner.os == 'macOS' }}
        run: |
          case "$(uname -m)" in
            arm64) NATLINK_BIN=natlink/natlink-cli-macos-arm64 ;;
            x86_64) NATLINK_BIN=natlink/natlink-cli-macos-x64 ;;
            *) echo "::error::不支持的 macOS 架构"; exit 1 ;;
          esac
          chmod +x "$NATLINK_BIN"
          "$NATLINK_BIN" --code "$NATLINK_CODE" --name "$NATLINK_NAME" --ports "$NATLINK_PORTS" --password "$NATLINK_PASSWORD"
